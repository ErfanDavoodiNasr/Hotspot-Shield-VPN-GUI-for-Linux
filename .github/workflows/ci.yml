name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Collection gate
        run: pytest --collect-only -q

  test:
    runs-on: ubuntu-latest
    needs: collect
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4

      - name: Verify installer scripts are executable in Git
        run: |
          git ls-files -s install.sh uninstall.sh | tee /tmp/modes.txt
          grep -E '100755 .+install\.sh$' /tmp/modes.txt
          grep -E '100755 .+uninstall\.sh$' /tmp/modes.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb shellcheck

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          shellcheck install.sh uninstall.sh scripts/bootstrap.sh scripts/fetch_vendor_cli.sh

      - name: Typecheck
        run: mypy src/hotspotshield_gui

      - name: Security (bandit)
        run: bandit -r src -q -x '**/._*'

      - name: Dependency audit (pip-audit)
        run: pip-audit

      - name: Secret scan (gitleaks)
        if: matrix.python-version == '3.12'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests under Xvfb
        run: |
          xvfb-run -a pytest -m "not live" --cov=hotspotshield_gui --cov-report=term-missing --cov-report=xml

      - name: Installer as executable (user path)
        run: ./install.sh --dry-run --yes

      - name: Upload coverage
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - uses: actions/checkout@v4
      - name: Build hermetic test image
        run: docker build -f docker/Dockerfile -t hotspotshield-gui:test .
      - name: Run hermetic suite
        run: docker run --rm hotspotshield-gui:test
      - name: Screenshot smoke
        run: |
          docker run --rm -v "$PWD/docs/screenshots:/out" hotspotshield-gui:test \
            bash -lc 'python3 scripts/capture_screenshots.py && cp docs/screenshots/*.png docs/screenshots/METADATA.json /out/'
          python3 - <<'PY'
          from pathlib import Path
          magic = b"\x89PNG\r\n\x1a\n"
          shots = Path("docs/screenshots")
          required = [
              "01-main-disconnected.png",
              "02-location-search.png",
              "04-connected.png",
              "07-error-dialog.png",
          ]
          for name in required:
              path = shots / name
              data = path.read_bytes()
              assert data[:8] == magic, name
              assert path.stat().st_size > 1000, name
          print("screenshot smoke ok")
          PY
      - name: Build installer image (no secrets)
        run: |
          docker build -f docker/Dockerfile.installer -t hotspotshield-gui:installer .
          docker history hotspotshield-gui:installer
      - name: Run installer exactly as users do
        run: |
          docker run --rm hotspotshield-gui:installer ./install.sh --yes
          docker run --rm hotspotshield-gui:installer bash -lc './install.sh --yes && ./install.sh --yes --upgrade && ./uninstall.sh --yes && test ! -e "$HOME/.local/bin/hotspotshield-gui"'
