[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotspotshield-gui"
version = "1.0.0"
description = "Consumer-friendly Linux desktop GUI for Hotspot Shield VPN"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hotspot Shield GUI Contributors" }]
keywords = ["vpn", "hotspotshield", "linux", "tkinter", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Security",
]
dependencies = [
    "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.0",
]

[project.scripts]
hotspotshield-gui = "hotspotshield_gui.app:main"

[project.urls]
Homepage = "https://github.com/ErfanDavoodiNasr/Hotspot-Shield-VPN-GUI-for-Linux"
Repository = "https://github.com/ErfanDavoodiNasr/Hotspot-Shield-VPN-GUI-for-Linux"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hotspotshield_gui = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: tests that use a real Hotspot Shield account and network",
    "gui: GUI tests that require Tk / Xvfb",
    "installer: installer / packaging tests",
    "slow: longer-running tests",
]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
timeout = 60

[tool.coverage.run]
branch = true
source = ["hotspotshield_gui"]
omit = [
    "*/tests/*",
    "*/hotspotshield_gui/ui/*",
    "*/hotspotshield_gui/app.py",
    "*/hotspotshield_gui/__main__.py",
    "*/hotspotshield_gui/utils/logging.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 65

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "SIM108", "SIM105", "E501", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S110", "S104", "BLE001", "SIM105", "E501"]
"scripts/**" = ["S105", "S106", "S110"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["hotspotshield_gui"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hotspotshield_gui.ui.*"]
disallow_untyped_calls = false
disable_error_code = ["call-overload", "no-untyped-call"]
